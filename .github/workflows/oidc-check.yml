name: OIDC Check

# Temporary diagnostic workflow; remove after validating npm Trusted Publishing.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check npm OIDC exchange
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            result="ACTIONS_ID_TOKEN_REQUEST_URL is empty (id-token permission missing?)"
          else
            token_json=$(curl -sS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
            id_token=$(printf '%s' "$token_json" | jq -r '.value // empty')

            if [ -z "$id_token" ]; then
              result="GitHub OIDC token request failed: $(printf '%s' "$token_json" | jq -c '{error,error_description}')"
            else
              body=$(mktemp)
              code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${id_token}" \
                -H "Accept: application/json" \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@code4x%2Fcli")

              if [ "$code" = "200" ] || [ "$code" = "201" ]; then
                result="OIDC exchange OK (HTTP ${code})"
              else
                result="OIDC exchange failed (HTTP ${code}): $(jq -c '{error,message,code}' "$body" 2>/dev/null || echo 'unparseable body')"
              fi
            fi
          fi

          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg body "OIDC diagnostic: $result" '{body:$body}' > /tmp/comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Felix-V587/code4x-create/issues/1/comments" \
            -d @/tmp/comment.json > /dev/null
