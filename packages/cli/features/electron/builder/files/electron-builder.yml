# electron-builder 打包配置。
# 文档：https://www.electron.build/configuration/configuration
#
# TODO（自定义）：发布前为你的应用设置一个反向 DNS 格式的 `appId`，例如
#   appId: com.example.myapp
# 否则 electron-builder 会回退到它自己的默认 app id。产品名由
# `package.json#name` 派生。

directories:
  # 将安装包输出到 `dist/` 之外（`dist/` 是 Vite+ 的构建输出）。
  output: release

# 仅打包编译后的应用。`package.json` 始终会被包含；`dist/main` 是
# `package.json#main` 指向的入口，`dist/renderer` 是 UI。
files:
  - dist/**
  - package.json

# asar 默认启用；如需退出可取消注释。
# asar: false

linux:
  target:
    - AppImage
  category: Utility
  # TODO（自定义）：AppImage 桌面元数据。在打包 .deb/.rpm 时设置 `maintainer`
  #（以及 package.json 中的 `description`）。

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities

win:
  target:
    - nsis
